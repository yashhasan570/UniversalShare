# Builds the app's installers and publishes them to this repository's GitHub
# releases under the tag "latest", which the app's update check watches.
# Windows: the Inno Setup installer (support/scripts/compile_windows_exe-inno.iss).
# Android: release APKs split per ABI, signed with a generated key.
# Run by hand (Actions -> Release -> Run workflow).
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: windows-x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: "stable"

      # The share-to helper packaged beside the app (app/windows expects the file).
      - name: MSIX helper
        shell: pwsh
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\localsend_msix_helper.msix

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile for Windows
        working-directory: app
        run: flutter build windows

      - name: Prepare Inno Setup payload
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\inno" | Out-Null
          Copy-Item -Path "app\build\windows\x64\runner\Release\*" -Destination "${{ runner.temp }}\inno" -Recurse
          Copy-Item -Path "app\assets\packaging\logo.ico" -Destination "${{ runner.temp }}\inno"
          Copy-Item -Path "support\build\windows\x64\*" -Destination "${{ runner.temp }}\inno" -Recurse
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\inno-result" | Out-Null

      - name: Compile installer
        run: iscc "/DSkipSignTool" "/DPayloadDir=${{ runner.temp }}\inno" "/DResultDir=${{ runner.temp }}\inno-result" support\scripts\compile_windows_exe-inno.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ runner.temp }}\inno-result\*
          if-no-files-found: error

  apk:
    name: android-apk
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      APK_BUILD_DIR: /tmp/build
    steps:
      - uses: actions/checkout@v4

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Copy files to build directory
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: "stable"

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Check rust-toolchain.toml
        working-directory: ${{ env.APK_BUILD_DIR }}/packages/localsend_isolates
        run: rustup show

      - name: Signing key
        working-directory: ${{ env.APK_BUILD_DIR }}/app/android
        run: |
          keytool -genkeypair -v -keystore universal-share.jks -alias universal \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass universalsign2026 -keypass universalsign2026 \
            -dname "CN=Universal Share, OU=Personal, O=Universal, C=BD"
          cat > key.properties <<PROP
          storeFile=$PWD/universal-share.jks
          storePassword=universalsign2026
          keyAlias=universal
          keyPassword=universalsign2026
          PROP

      - name: Dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error

  publish:
    needs: [windows, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: Rename, checksums, version
        run: |
          v=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' app/pubspec.yaml)
          cd dist
          for f in *.exe; do [ "$f" != "UniversalShare-$v-windows-x86-64.exe" ] && mv "$f" "UniversalShare-$v-windows-x86-64.exe"; done
          for f in app-*.apk; do abi=${f#app-}; abi=${abi%-release.apk}; mv "$f" "UniversalShare-$v-$abi.apk"; done
          sha256sum $(ls | grep -v SHA256SUMS.txt) > SHA256SUMS.txt
          echo "VERSION=$v" >> "$GITHUB_ENV"
          ls -la

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* \
            --title "Universal Share v$VERSION" \
            --notes "Windows installer and Android APKs (per ABI). SHA256SUMS.txt included." \
            --target main
