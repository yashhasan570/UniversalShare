display_name: Universal Share
packager: johnconstantine570
packagerEmail: dev.tien.donam@gmail.com
url: https://github.com/yashhasan570/UniversalShare
buildArch: x86_64
license: MIT

icon: assets/img/logo-512.png

requires:
  # The app links libappindicator3.so.1. Plain "libappindicator" is the GTK2
  # variant and pulls in gtk2, which the app does not use.
  - libappindicator-gtk3
  - xdg-user-dirs

keywords:
  - Sharing
  - LAN
  - Files

generic_name: An open source cross-platform alternative to AirDrop
summary: Share files easily with Universal Share
group: Applications/Utilities

categories:
  - GTK
  - FileTransfer
  - Utility

startup_notify: true
